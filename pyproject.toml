[project]
name = "sales-forecast"
version = "0.1.0"
description = "Classical time-series forecasting of retail sales (ITMO, applied time series analysis, lab 1)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "flake8>=6", "jupyter", "nbconvert", "nbformat"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
